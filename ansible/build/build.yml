- name: 'Build Gerrit AMI'
  hosts: localhost
  connection: local
  pre_tasks:
  - name: 'Load local AWS credentials when present (off-EC2 builds)'
    set_fact:
      build_env: "{{ lookup('file', playbook_dir + '/aws-creds.json') | from_json }}"
    when: (playbook_dir + '/aws-creds.json') is exists
  environment: '{{ build_env | default({}) }}'
  tasks:
  - include_role:
      name: 'alpha-build-lib/build-ami'
    vars:
      installation_roles:
      - install-gerrit
